<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161c2c"><meta name="apple-mobile-web-app-capable" content="yes"><title>KIMU STUDIO</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f6fc;background:#101421}*{box-sizing:border-box}body{margin:0}.wrap{max-width:620px;margin:auto;padding:22px 17px 60px}h1{letter-spacing:.13em;margin:4px 0}small,.muted{color:#aab2c8}.card{background:#1b2233;border:1px solid #344058;border-radius:18px;padding:18px;margin:16px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{font-size:12px;color:#a7f3d0;background:#16483c;padding:5px 10px;border-radius:99px}label{display:block;margin:15px 0 7px;font-weight:650}select,input[type=text],input[type=number],textarea{width:100%;padding:13px;border-radius:11px;background:#101827;color:white;border:1px solid #44516b;font:inherit}textarea{min-height:86px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode{border:1px solid #45516a;background:#232d41;color:#fff;padding:13px;border-radius:12px;font:inherit;cursor:pointer}.mode.active{background:#465fa0;border-color:#99b2ff}.check{display:flex;gap:10px;align-items:center;font-weight:400}input[type=checkbox]{width:18px;height:18px}button.primary{background:#8eaaff;color:#0d1730;border:0;font-weight:800;padding:15px;border-radius:12px;width:100%;font-size:16px;margin:8px 0}button.secondary{background:#29364e;color:#fff;border:1px solid #4b5971;padding:11px;border-radius:10px;font:inherit}button:focus-visible,select:focus-visible{outline:3px solid #9bb5ff}#notice{min-height:20px;color:#b3e5ce}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#c9d2e7}.hidden{display:none}</style></head><body><main class="wrap"><div class="row"><div><small>きむ本部・撮影操作パネル</small><h1>KIMU STUDIO</h1></div><span class="pill">Identity LOCK</span></div><p class="muted">設定はこの端末に保存。正式な人物マスターは「きむ本部」の既存設定を使用します。</p><section class="card"><label>撮影モード</label><div class="modes" id="modes"></div><label for="scene">背景</label><select id="scene"><option value="現在の背景を維持">現在の背景を維持</option><option>ハロウィン階段</option><option>大学</option><option>カフェ</option><option>自然光の部屋</option><option>新しいシーンを提案</option></select><label for="hair">髪型</label><select id="hair"><option>現在の髪型を維持</option><option>ストレートロング</option><option>ラフなお団子</option><option>ポニーテール</option></select><label for="pose">ポーズ・動作</label><select id="pose"><option>自然な動作を提案</option><option>カメラを見る</option><option>振り向く</option><option>歩く</option><option>座る</option><option>髪に触れる</option></select><div id="continuous"><label for="minutes">前カットからの経過時間（分）</label><input id="minutes" type="number" min="0" max="1440" value="5"><label class="check"><input id="wrinkles" type="checkbox" checked>衣装のシワ・着崩れを追跡</label><label class="check"><input id="flyaways" type="checkbox" checked>後れ毛・髪の乱れを追跡</label><label class="check"><input id="sweat" type="checkbox">発汗・肌の変化を追跡</label></div><label for="details">追加の指示（任意）</label><textarea id="details" placeholder="変更したい箇所、維持したい小物など"></textarea><label class="check"><input id="confirm" type="checkbox">設定確認後、明示的に画像生成を依頼する</label></section><button class="primary" id="shoot">GPTで撮影する ↗</button><button class="secondary" style="width:100%" id="copy">撮影指示をコピー</button><p class="muted">「GPTで撮影する」は指示をコピーしてChatGPTを開きます。ChatGPTで貼り付けて送信してください。正式マスター画像の参照確認が必要です。</p><div class="row"><button class="secondary" id="chat">きむ本部を開く ↗</button><button class="secondary" id="save">設定を書き出す</button><button class="secondary" id="load">設定を読み込む</button></div><input class="hidden" id="file" type="file" accept="application/json"><p id="notice" role="status"></p><section class="card"><b>撮影指示プレビュー</b><pre id="preview"></pre></section><small>このWebアプリは撮影指示の作成ツールです。画像生成・プラグイン実行・クラウド同期は未接続です。端末内の保存データはブラウザの消去操作で失われる場合があります。</small></main><script>
const names=['単発撮影','連続撮影','新しいシーン','部分修正','自己採点'],keys=['scene','hair','pose','minutes','wrinkles','flyaways','sweat','details','confirm'];let mode='単発撮影';const el=id=>document.getElementById(id);const chatUrl='https://chatgpt.com/plugins/plugins_6ac89e5dae708191bbefa505ab490f36';function data(){let d={mode};for(const k of keys)d[k]=el(k).type==='checkbox'?el(k).checked:el(k).value;return d}function prompt(){const d=data();return `きむ本部の既存撮影フローを使ってください.
撮影モード：${d.mode}
背景：${d.scene}
髪型：${d.hair}
ポーズ：${d.pose}
${d.mode==='連続撮影'?`前カットからの経過時間：${d.minutes}分
衣装の変化：${d.wrinkles?'追跡':'指定なし'}
髪の乱れ：${d.flyaways?'追跡':'指定なし'}
発汗：${d.sweat?'追跡':'指定なし'}
`:''}追加指示：${d.details||'なし'}
正式KIMU_IDENTITY_MASTERを唯一の人物正本として使い、既存のPERSON/GEOMETRY/CAPTURE/DELTA、参照ルーティング、QCルールを守ってください。参照画像を生成器が利用できない場合は停止して説明してください。${d.mode==='自己採点'?'画像を生成せず、実際に参照できる完成画像について自己採点してください。':d.confirm?'この設定で画像生成を依頼します。':'まず設定確認のみ。画像はまだ生成しないでください。'}`}function render(){el('modes').innerHTML='';for(const n of names){const b=document.createElement('button');b.className='mode'+(mode===n?' active':'');b.textContent=n;b.onclick=()=>{mode=n;update()};el('modes').append(b)}el('continuous').classList.toggle('hidden',mode!=='連続撮影');el('preview').textContent=prompt();localStorage.setItem('kimu-studio-v1',JSON.stringify(data()))}function update(){render()}function restore(d){if(!d||!names.includes(d.mode))return;mode=d.mode;for(const k of keys){if(!(k in d))continue;if(el(k).type==='checkbox')el(k).checked=!!d[k];else el(k).value=d[k]}render()}for(const k of keys)el(k).addEventListener('input',update);try{restore(JSON.parse(localStorage.getItem('kimu-studio-v1')))}catch{}render();async function copyPrompt(){try{await navigator.clipboard.writeText(prompt());return true}catch{return false}}el('copy').onclick=async()=>{el('notice').textContent=await copyPrompt()?'コピーしました。きむ本部のチャットに貼り付けてください。':'コピーできませんでした。下のプレビューを選択してコピーしてください。'};el('shoot').onclick=async()=>{const w=window.open('about:blank','_blank');const copied=await copyPrompt();if(!copied){if(w)w.close();el('notice').textContent='コピーできませんでした。撮影指示プレビューを手動でコピーしてください。';return}el('notice').textContent='撮影指示をコピーしました。開いたChatGPTの入力欄に貼り付けて送信してください。';if(w)w.location.href=chatUrl;else window.location.href=chatUrl};el('chat').onclick=()=>window.open(chatUrl,'_blank','noopener');el('save').onclick=()=>{const blob=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kimu-studio-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};el('load').onclick=()=>el('file').click();el('file').onchange=async e=>{try{restore(JSON.parse(await e.target.files[0].text()));el('notice').textContent='設定を読み込みました'}catch{el('notice').textContent='設定ファイルを読み込めませんでした'}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
